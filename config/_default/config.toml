# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

# baseURL = "https://www.petercipov.com/"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]

[markup.highlight]
      codeFences = true
      guessSyntax = true
      hl_Lines = ""
      lineNoStart = 1
      lineNos = false
      lineNumbersInTable = true
      tabWidth = 4
      noClasses = false
